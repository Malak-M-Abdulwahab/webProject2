<html>
    <head>

        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/all.css">
        <link rel="stylesheet" href="css/Login.css">

    </head>
    <body>


        <header>
            <div id="header">
                <img src="images/Angelic_Pretty_Logo.png" alt="header-logo" id="header-logo">
            </div> <!-- /header -->
        </header>

        <section>
            <div id="main-container">
                <div id="main">
                    <form action="" id="main-form" method="post">
                        <p id="email-p">Email</p>
                        <input type="text" id="email" placeholder="Enter email" name="email">
                        <p id="password-p">Password</p>
                        <input type="password" id="password" placeholder="Enter password" name="password">
                        <div id="remember">
                            <input id="remember-check" type="checkbox">
                            <span id="remember-span">Remember Me</span>
                        </div>
                        <input type="submit" id="submit" value="Login">
                        <div id="register">
                            <span id="register-p">Don't have an account? </span>
                            <a href="register.html" id="register-a">Register</a>
                        </div>
                    </form> <!-- /main-form -->
                </div> <!-- /main -->
            </div> <!-- /main-container -->
        </section>
        
        <script src="js/Login.js"></script>

    </body>
</html>
